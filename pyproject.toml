[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "million-dollar-tuner"
version = "0.1.0"
description = "Vocal tuning and replacement tool for SUNO AI songs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pydub>=0.25",
    "demucs>=4.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "pyrubberband>=0.3",
    "psola>=0.0.1",
    "pedalboard>=0.9",
    "pretty-midi>=0.2.10",
    "pyfluidsynth>=1.3",
]

[project.optional-dependencies]
crepe = ["crepe>=0.0.16", "tensorflow>=2.12"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["mdt*"]

[project.scripts]
mdt = "mdt.cli:main"
